name: authforge

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - ../.env
    environment:
      # Inside the compose network Postgres is reachable at the "postgres"
      # service name, not the POSTGRES_HOST from .env (typically "localhost").
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - ../.env
    ports:
      - '5432:5432'
    volumes:
      - authforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  authforge_postgres_data:
